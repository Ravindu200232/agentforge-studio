# The local Supabase CLI stack (`supabase start`), for local development and for the tests under
# test/helpers/db.js. Deliberately minimal, not a full `supabase init` dump - reconcile it with
# `supabase init` if the installed CLI's own schema has moved past this.
project_id = "__APP_DB__"

[api]
enabled = true
port = 54321

[db]
port = 54322

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"

[storage]
enabled = true

# One [functions.<name>] section per service under supabase/functions/ - verify_jwt = true means
# only a signed-in user's request reaches it; set false only for a function meant to be public,
# and give it its own CORS headers either way (Supabase adds none automatically).
[functions.example]
verify_jwt = true
