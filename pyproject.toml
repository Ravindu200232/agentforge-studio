[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ollama-terminal-agent"
version = "0.2.0"
description = "A terminal coding agent powered by the Ollama Python SDK, and the AgentForge studio backend built on it"
readme = "README.md"
requires-python = ">=3.10"
# pydantic validates the SRS document against the ported schema; without it the
# studio backend cannot check a specification before the builder reads it.
# presidio + spacy are the privacy filter every message goes through before a model (server_modules/privacy.py); it finds
# names with spaCy's small English model: python -m spacy download en_core_web_sm.
dependencies = ["ollama>=0.6.2,<1", "httpx>=0.27,<1", "pydantic>=2.6,<3", "cryptography>=42,<48",
                "presidio-analyzer>=2.2,<3", "presidio-anonymizer>=2.2,<3", "spacy>=3.7,<4"]

[project.scripts]
oterm = "ollama_terminal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
